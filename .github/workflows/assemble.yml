name: Assemble assets
on:
  push:
    paths:
      - chunks/**
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash assemble.sh
      - run: |
          git config user.name curio-bot
          git config user.email curio@wellsonyx.com
          git add assets/index-CBV8Q18_.css assets/index-CF7O1ExU.js
          git diff --staged --quiet || git commit -m Assemble-assets
          git push
